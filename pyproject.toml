[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creg-mcp-server"
version = "0.1.0"
description = "MCP server to query Colombian CREG energy regulation (resolutions and legal opinions) with computed validity and a regulatory graph"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Juan Pablo Salamanca" }
]
keywords = ["creg", "colombia", "energy-regulation", "regulacion", "mcp", "model-context-protocol", "agpe", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp[cli]>=1.26,<2",
    "pydantic>=2.0.0",
]

[project.urls]
Repository = "https://github.com/jpsalamanca-co/creg-mcp"
Issues = "https://github.com/jpsalamanca-co/creg-mcp/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
creg-mcp = "creg_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/creg_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"
